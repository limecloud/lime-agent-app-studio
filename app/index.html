<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>发布应用</title>
    <link rel="stylesheet" href="/styles.css" />
    <script type="importmap">
      {
        "imports": {
          "@lime/app-sdk": "/vendor/lime-app-sdk/index.js"
        }
      }
    </script>
  </head>
  <body>
    <main class="shell">
      <header class="page-header" aria-label="应用状态">
        <div>
          <p class="eyebrow">开发者工具</p>
          <h1 id="pageTitle">发布应用</h1>
          <p class="page-copy">选择包含 <code>APP.md</code> 的目录，确认识别结果，然后发布到云端。</p>
        </div>
        <div class="header-actions">
          <div class="theme-switcher" role="group" aria-label="主题">
            <button type="button" data-theme-option="system" aria-pressed="true">跟随</button>
            <button type="button" data-theme-option="light" aria-pressed="false">浅色</button>
            <button type="button" data-theme-option="dark" aria-pressed="false">深色</button>
          </div>
          <span id="status" class="status-pill">等待目录</span>
        </div>
      </header>

      <section class="panel publish-panel" aria-labelledby="pageTitle">
        <div class="directory-row">
          <div class="field-block">
            <span class="field-label">应用目录</span>
            <p id="dirText" class="dir-text">尚未选择</p>
          </div>
          <div class="directory-actions">
            <button id="selectDirBtn" class="button primary" type="button">选择目录</button>
            <button id="inspectBtn" class="button secondary" type="button" disabled>重新识别</button>
          </div>
        </div>

        <div class="app-summary" aria-label="识别结果">
          <div id="iconPreview" class="icon-preview" aria-hidden="true">App</div>
          <div class="app-summary-copy">
            <span class="field-label">识别结果</span>
            <h2 id="appTitle">等待选择目录</h2>
            <p id="appMeta">选择目录后显示应用名称和类型。</p>
            <div id="categoryChips" class="chips" aria-label="应用分类"></div>
          </div>
        </div>

        <div id="resultBanner" class="result-banner" hidden>
          <strong id="resultTitle"></strong>
          <span id="resultCopy"></span>
        </div>

        <section class="logo-workshop" aria-labelledby="logoWorkshopTitle">
          <div class="logo-preview-frame">
            <div id="logoPreview" class="logo-preview" aria-hidden="true"></div>
          </div>
          <div class="logo-workshop-copy">
            <span class="field-label">Logo 工坊</span>
            <h2 id="logoWorkshopTitle">应用中心 Logo</h2>
            <p id="logoWorkshopCopy">识别目录后可生成一枚可打包的应用图标，并写入 <code>APP.md</code>。</p>
            <div class="logo-actions">
              <button id="logoBriefBtn" class="button secondary" type="button" disabled>生成提示词</button>
              <button id="logoGenerateBtn" class="button secondary" type="button" disabled>请求宿主生成</button>
            </div>
          </div>
        </section>

        <div class="publish-row">
          <div class="publish-copy">
            <strong id="nextStepTitle">选择目录后即可发布</strong>
            <p id="activityText">先选择应用目录。</p>
            <p id="nextStepCopy">发布会使用 Lime 当前登录状态。</p>
          </div>
          <button id="publishBtn" class="button publish" type="button" disabled>发布到云端</button>
        </div>
      </section>

      <details class="panel advanced-panel">
        <summary>手动设置</summary>
        <p class="advanced-hint">普通发布不需要填写。只有目录选择器不可用，或脱离 Lime 运行时，才需要临时填写这些字段。</p>
        <div class="advanced-grid">
          <label>手动目录 <input id="appDir" placeholder="/path/to/agent-app" /></label>
          <label>App ID 覆盖 <input id="appId" placeholder="默认自动识别" /></label>
          <label>Tenant ID <input id="tenantId" placeholder="宿主会话会自动同步" /></label>
          <label>API Base <input id="apiBase" placeholder="宿主会话会自动同步" /></label>
          <label>临时 Token <input id="token" type="password" placeholder="仅 CLI / 脱离宿主时使用" /></label>
          <label>Channel <input id="channel" value="beta" /></label>
        </div>
      </details>

      <details id="logPanel" class="panel result-panel">
        <summary>
          <span>诊断详情</span>
          <small>排查问题时查看</small>
        </summary>
        <div id="output" class="output-card">暂无诊断信息。</div>
      </details>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
